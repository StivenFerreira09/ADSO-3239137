<script>
(function(){

const P = D.proyectos;

    for (const a of filas){
      const per = porLogin[a.login];
      const casa = a.es_su_proyecto === "si" ? `<span class="tag ok">este</span>` : (per && per.proyecto_repo ? `<span class="tag flat">${esc(nomRepo(per.proyecto_repo))}</span>` : `<span class="tag crit">ninguno</span>`);
      tabla += `<tr><td><div class="who"><span class="user">${esc(a.login.replace("sin-cuenta:","sin cuenta · "))}</span><span class="n">${esc(title(a.nombre))}</span></div></td>
        <td>${casa}</td><td class="r">${a.commits}</td>
        <td><div class="share"><span class="t"><span class="f" style="width:${a.pct_commits}%"></span></span><span class="p">${a.pct_commits}%</span></div></td>
        <td class="r">${a.arch_reales}</td>
        <td><div class="share"><span class="t"><span class="f" style="width:${a.pct_arch_reales}%"></span></span><span class="p">${a.pct_arch_reales}%</span></div></td>
        <td class="r">${a.prs}</td><td class="r"><span class="plus">+${fmt(a.add)}</span> <span class="minus">−${fmt(a.del)}</span></td></tr>`;
    }

  h += `<article class="proj"><div class="bar ${bar}"></div>

    <div class="panel"><div class="cols"><div><div class="panel-title">Qué está entregado, a medias y qué falta</div><div class="notes">${notas.join("")}</div></div>

for (const p of ps){
